name: tmp-b2-smoke
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - name: Smoke test B2 (node lib vs curl sigv4)
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
          B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
        run: |
          echo "--- curl sigv4 tiny PUT"
          echo -n "hello world" > /tmp/tiny.txt
          curl -s -o /tmp/curl_out.xml -w "curl PUT -> HTTP %{http_code}\n" \
            --request PUT \
            --aws-sigv4 "aws:amz:${B2_REGION}:s3" \
            --user "${B2_ACCESS_KEY_ID}:${B2_SECRET_ACCESS_KEY}" \
            -H "x-amz-content-sha256: $(sha256sum /tmp/tiny.txt | cut -d' ' -f1)" \
            -T /tmp/tiny.txt \
            "${B2_ENDPOINT}/${B2_BUCKET}/smoke/curl-tiny.txt"
          head -c 300 /tmp/curl_out.xml; echo
          echo "--- curl sigv4 GET"
          curl -s -o /tmp/curl_get.txt -w "curl GET -> HTTP %{http_code}\n" \
            --aws-sigv4 "aws:amz:${B2_REGION}:s3" \
            --user "${B2_ACCESS_KEY_ID}:${B2_SECRET_ACCESS_KEY}" \
            "${B2_ENDPOINT}/${B2_BUCKET}/smoke/curl-tiny.txt"
          head -c 200 /tmp/curl_get.txt; echo
          echo "--- region echo (safe: bucket region only)"
          curl -s "https://api.backblazeb2.com/b2api/v2/b2_get_bucket_info" -X POST > /dev/null 2>&1 || true
