name: Staging E2E (explicit secrets, nonproduction only)
on:
  workflow_dispatch:
  push:
    branches: ['arena/3711df6a-autodine']
    paths:
      - '.github/workflows/staging-e2e.yml'
      - 'playwright.staging.config.ts'
      - 'scripts/staging/**'
      - 'e2e/integration/**'
permissions:
  contents: read
concurrency:
  group: isolated-staging-e2e
  cancel-in-progress: false
jobs:
  staging-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_BASE_URL: https://new-git-arena-9b120325-autodine-iamjarvis9896-3988s-projects.vercel.app
      STAGING_SUPABASE_URL: https://juwyhslzchjevqkdvwjm.supabase.co
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AUTODINE_STAGING_SERVICE_ROLE_KEY }}
      STAGING_SHARE_URL: ${{ secrets.AUTODINE_STAGING_SHARE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require secrets before accessing services or writing fixtures
        shell: bash
        run: |
          if [[ -z "$STAGING_SUPABASE_SERVICE_ROLE_KEY" || -z "$STAGING_SHARE_URL" ]]; then
            echo '::error::Staging setup blocked: configure AUTODINE_STAGING_SERVICE_ROLE_KEY and AUTODINE_STAGING_SHARE_URL as repository Actions secrets. Do not put them in workflow inputs or code.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify share origin matches the approved base (no writes)
        run: node scripts/staging/verify-share-origin.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The runner prints only generic, pre-redacted diagnostics (no secret
      # values) by design; tee them to a file and re-emit as an annotation on
      # failure so the Checks API can carry them when the log CDN is not
      # reachable from the operator environment. This changes no behavior.
      - name: Provision uniquely namespaced fixtures (no email, no existing-data reset)
        run: |
          set -o pipefail
          node scripts/staging/provision-e2e.mjs 2>&1 | tee "$RUNNER_TEMP/staging-provision.log"

      - name: Surface fixture-provision failure as an annotation
        if: failure()
        run: node scripts/ci/print-error-annotation.mjs "$RUNNER_TEMP/staging-provision.log" 2500 12

      # Non-blocking: mints and age-shifts ONE synthetic cashier invitation so
      # invites.spec.ts can prove an expired link is refused. Exits 0 on any
      # failure and exports nothing, so the spec then reports that one test as
      # skipped — honest, never green.
      - name: Mint aged synthetic invitation (non-blocking)
        if: success()
        run: |
          set -o pipefail
          node scripts/staging/invite-mint.mjs 2>&1 | tee "$RUNNER_TEMP/staging-invite-mint.log"

      - name: Real staging browser workflows
        run: |
          set -o pipefail
          npx playwright test --config playwright.staging.config.ts 2>&1 | tee "$RUNNER_TEMP/staging-browser.log"

      - name: Surface staging browser failure as an annotation
        if: failure()
        run: node scripts/ci/print-error-annotation.mjs "$RUNNER_TEMP/staging-browser.log" 2500 12

      # Hosted Auth/RBAC/monitoring probes through the real application paths.
      # Runs even if the browser suites failed (provisioned fixtures are what
      # matter here). Hard-fails on any failed check: a hosted defect must
      # surface. Publishes counts only, never values.
      - name: Hosted Auth/RBAC/monitoring acceptance probes (synthetic)
        if: always()
        run: |
          set -o pipefail
          node scripts/staging/auth-acceptance.mjs 2>&1 | tee "$RUNNER_TEMP/staging-auth-acceptance.log"

      - name: Surface acceptance probe failure as an annotation
        if: failure()
        run: node scripts/ci/print-error-annotation.mjs "$RUNNER_TEMP/staging-auth-acceptance.log" 2500 12

      - name: Publish counts only (no traces, URLs, credentials or raw reports)
        if: always()
        shell: bash
        run: |
          node scripts/staging/report-e2e.mjs
