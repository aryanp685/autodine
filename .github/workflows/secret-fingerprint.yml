name: Secret fingerprint
on: workflow_dispatch
jobs:
  fp:
    runs-on: ubuntu-latest
    environment: backup-staging
    steps:
      - name: fingerprint
        env:
          U: ${{ secrets.STAGING_AUTODINE_BACKUP_SOURCE_URL }}
        run: node -e 'const u=process.env.U;const c=require("crypto");console.log("len",u.length,"sha256",c.createHash("sha256").update(u).digest("hex"),"first5",u.slice(0,5),"userField",u.split("//")[1]?.split(":")[0]?.slice(0,8))'
