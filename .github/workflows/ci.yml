name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: typecheck · lint · design · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Design system guard
        run: npm run design:check

      - name: Migration syntax check
        run: npm run sql:check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
