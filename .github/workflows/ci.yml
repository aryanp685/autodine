name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: typecheck · lint · design · test · build
    runs-on: ubuntu-24.04
    env:
      CI: 'true'
      AUTODINE_TEST_DEMO_BUILD: 'true'
      VERCEL_ENV: 'test'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Design system guard
        run: npm run design:check

      - name: Migration syntax check
        run: npm run sql:check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  native-database:
    name: clean migrations · SQL boundaries (PG ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ['15', '17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: disposable-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Replay from empty schema and test native SQL against synthetic fixtures
        run: npm run test:db
        env:
          READINESS_PG_ADMIN_URL: postgres://postgres:disposable-ci-password@127.0.0.1:5432/postgres
          READINESS_PG_CONTAINER: ${{ job.services.postgres.id }}
