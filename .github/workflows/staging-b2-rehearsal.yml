name: Staging B2 backup and disposable restore

# Manually dispatched, staging-only rehearsal of the backup path:
#
#   disposable PostgreSQL 17  <-  decrypt + restore + verify
#        ^                                   |
#        |                          download newest object
#   Backblaze B2 (bucket, region: environment-designated)
#        ^
#   encrypted backup taken from the designated STAGING Supabase project
#
# Registration and dispatch
# ------------------------
# GitHub registers manual workflows from the DEFAULT BRANCH. Until this file
# is merged to `main`, it is dispatchable only when a registration patch that
# adds this exact file is applied to `main`. Dispatching requires explicit
# owner authorization; dispatching reads STAGING data, creates a real B2
# object and may incur charges. No remote pruning is ever performed here.
#
# Exact-code / ref validation
# ---------------------------
# The `ref` input accepts a full 40-character lowercase hex commit SHA only
# (branch names, tags and short SHAs are refused). When empty, it resolves to
# the commit this workflow runs at (for the default-branch registration, the
# default-branch tip). The `exact-code-gate` job then fetches EXACTLY that
# commit and refuses to proceed unless the fetched tree carries, byte for
# byte, the reviewed staging implementation pinned below (every file
# first-party code would execute, plus package.json / package-lock.json).
# After the gate passes, the rehearsal job checks out that exact SHA and runs
# whatever it contains. If the ref does not contain the pinned implementation —
# for example today's `main`, which lacks `validate-staging-source.mjs` and
# has older backup scripts — the gate fails closed BEFORE any credential is
# materialized anywhere. The gate job holds no environment, secret or
# variable.
#
# When the pinned implementation changes, the manifest below (and the
# `staging-rehearsal-wiring.test.mjs` guard that re-derives it from the tree)
# must be regenerated in the SAME change. Never edit the manifest by hand.
#
# Environment gate and secrets
# ----------------------------
# The rehearsal job binds the protected `backup-staging` GitHub Environment
# and consumes ONLY these environment secrets:
#
#   STAGING_AUTODINE_BACKUP_SOURCE_URL   designated staging read connection
#   STAGING_AUTODINE_BACKUP_PASSPHRASE   backup encryption passphrase
#   STAGING_B2_REGION                    staging bucket region
#   STAGING_B2_BUCKET                    staging bucket (never a production one)
#   STAGING_B2_ACCESS_KEY_ID             staging B2 application keyID
#   STAGING_B2_SECRET_ACCESS_KEY         staging B2 application key
#
# and ONLY these environment variables:
#
#   AUTODINE_STAGING_PROJECT_REF         20-char ref of the designated staging project
#   AUTODINE_STAGING_B2_BUCKET           the same staging bucket name, designated again
#   AUTODINE_PRODUCTION_B2_BUCKETS       JSON array of production bucket names (refusal list)
#
# No production secret name is referenced, `secrets: inherit` is never used,
# and no value is printed, artifacted or passed to a step that does not need
# it. The preflight step checks PRESENCE with GitHub boolean expressions —
# the secret or variable VALUES never enter that step at all; it reports the
# NAMES of anything missing and fails closed. The semantic check
# (validate-staging-source.mjs) then proves the source URL targets the
# designated staging project and the staging bucket, is not loopback, and is
# not a production bucket — failing closed otherwise.
#
# Fallback posture (verified, with limits): GitHub falls back to a
# repository-scoped secret/variable of the SAME NAME when the environment
# does not define one. The names are uniquely STAGING_-prefixed and the
# owner must not create repository copies; presence checks cannot distinguish
# the two scopes, so the semantic validator and the production-bucket
# refusal list are the second, independent layer. The workflow does NOT fall
# back to: any unprefixed/production secret name, `.env` files (no backup
# script loads one — guarded by test), a B2 endpoint override (not wired;
# only official backblazeb2.com endpoints are accepted by the client), a
# scratch/expected-ref opt-in, or any other environment (exactly one
# `environment:` declaration exists, `backup-staging`).
#
# A 40-character `ref` that does not contain the pinned implementation is the
# ONLY thing this workflow rehearses; see the gate. DO NOT dispatch without
# explicit owner authorization. The PostgreSQL service is a disposable
# loopback container; the restore target is loopback-only by guard and the
# restore scripts refuse anything else.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Full 40-character lowercase hex commit SHA of the reviewed implementation. Empty = the commit this workflow runs at. Anything else fails closed."
        required: false
        type: string
        default: ""
      environment_scope_attested:
        description: "Owner attests all 6 secrets and 3 variables are Environment-only with no repository-level shadows."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-b2-rehearsal
  cancel-in-progress: false

jobs:
  exact-code-gate:
    name: exact-code gate (fail closed, no credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REF: ${{ inputs.ref || github.sha }}
      ENVIRONMENT_SCOPE_ATTESTED: ${{ inputs.environment_scope_attested }}
    steps:
      - name: Require a full lowercase commit SHA
        run: |
          if ! [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::inputs.ref must be a full 40-character lowercase hex commit SHA — branch names, tags and short SHAs are refused"
            exit 1
          fi
      - name: Require recorded Environment-only owner attestation
        run: |
          if [ "$ENVIRONMENT_SCOPE_ATTESTED" != 'true' ]; then
            echo '::error::Owner Environment-only scope attestation is required; API denial is not proof of absence.'
            exit 1
          fi
          echo 'Owner attestation recorded: six secrets and three variables are Environment-only with no repository-level shadows.'
      - name: Fetch the requested commit (no tags, depth 1)
        run: |
          set -euo pipefail
          gate_dir="$RUNNER_TEMP/exact-code-gate"
          rm -rf "$gate_dir"
          mkdir -p "$gate_dir"
          cd "$gate_dir"
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$REF"
          fetched="$(git rev-parse FETCH_HEAD)"
          if [ "$fetched" != "$REF" ]; then
            echo '::error::the fetch returned a different commit than requested — refusing to proceed'
            exit 1
          fi
          echo "GATE_DIR=$gate_dir" >> "$GITHUB_ENV"
      - name: Verify the pinned staging implementation byte for byte
        run: |
          # --- exact-code-gate BEGIN
          set -euo pipefail
          cd "$GATE_DIR"
          cat > expected.txt <<'V3_MANIFEST'
          100644 blob bd40bdf9b1a64b367b76ea7676af05f25fd6a887	.github/actions/postgres-client/action.yml
          100755 blob 35cfbb3dee583e2b9d87e9a14e23ca65941f2642	.github/actions/postgres-client/install-client.sh
          100755 blob ff890e80ccd94b353e96ef903884d68a589ce78f	.github/actions/postgres-client/verify-client.sh
          100644 blob 5ab00388831bd09c4af33bc6e6884985cefbde6a	package-lock.json
          100644 blob 1e434643bf0bd523e813a88f264d9fca30fd3571	package.json
          100644 blob cf5326d1ada5681e5b4af4895be3d8da96a2b51d	scripts/backup/b2-owner-checklist.test.mjs
          100644 blob 5b657cc7577aaa63ba0ba8cf284f6d52c51bd7c3	scripts/backup/b2-upload.test.mjs
          100644 blob b78380e31088bdf90d8714f3e55697111cf655e5	scripts/backup/backup-logical.mjs
          100644 blob 31850aef84926d2e1f161a66312cedfa2134317d	scripts/backup/backup-mode.test.mjs
          100644 blob ae1546c1668e416c0405568e9d17564ebf56f0a7	scripts/backup/backup-source.test.mjs
          100644 blob 7e4e0df3e49f16dfac4103e1fef114342af575de	scripts/backup/check-dr-objectives.mjs
          100644 blob 4094d3fca9da88e65b7c5511a2a2bd0a216d75c5	scripts/backup/check-dr-objectives.test.mjs
          100644 blob 5144b57ed7c8f1164eee9aca6a9a44ecf8af7b57	scripts/backup/compare-rehearsal-manifests.mjs
          100644 blob 9fdcef5533f5f48732bb009822804e2a582f8c0d	scripts/backup/compare-rehearsal-manifests.test.mjs
          100644 blob c5acb87169f5b35414fe37e494c9564a5756e56f	scripts/backup/download-b2.mjs
          100644 blob a0ca69f3574b6c77726231ccf46b06b04e3e180a	scripts/backup/dump-order.test.mjs
          100644 blob 56c8cbcfc852b0c8d033030a4cff07e0da85b685	scripts/backup/lib-b2-read.mjs
          100644 blob 644ca4d7fc3b425780436d0f92b75837b39b94da	scripts/backup/lib-b2.mjs
          100644 blob 7a31acde06336536071059872233d3b81ace5fb1	scripts/backup/lib-backup-error.mjs
          100644 blob b44c078b436bba02b376c08b61d8b04b8aa7fc4f	scripts/backup/lib-backup-error.test.mjs
          100644 blob aa0899f196e7278a3be10f6a0bd05e63541e7f23	scripts/backup/lib-backup-mode.mjs
          100644 blob b99e1d42f44d9a872d0d72598ed61a28584d72f7	scripts/backup/lib-backup-source.mjs
          100644 blob 8094474fe5d4323013fa76dd0576e58a82201469	scripts/backup/lib-crypto.mjs
          100644 blob 09a64d80d2a580aebc10203aa81497279939e8cb	scripts/backup/lib-dump.mjs
          100644 blob 0bb51710a6e80823fe4368dd8e5ddbb246f5a5bf	scripts/backup/lib-pg-client.mjs
          100644 blob 46475b36af0df4f2ded1a97d6b9c12a9b13cb345	scripts/backup/lib-pg-client.test.mjs
          100644 blob e421f76a28942cf5818e63693b1a3252a3e9007d	scripts/backup/lib-pg-service.mjs
          100644 blob b91c4cb3e7773a17fdec8845e7fd32471096c7da	scripts/backup/lib-pg-service.test.mjs
          100644 blob 24049caa0cd1e6b8a6a98f3ee61c47f0ae6c0057	scripts/backup/lib-restore-target.mjs
          100644 blob c647798af0c62ef47b63d80fa9663b62ec7c6609	scripts/backup/lib-schedule.mjs
          100644 blob 4becad097fa7abf08092a51edf33ca0905c2001b	scripts/backup/passphrase-contract.test.mjs
          100644 blob d091edbb3fa5c2dfe09c1c6ef40f74e8c5d03818	scripts/backup/postgres-client-action.test.mjs
          100644 blob 5450afbaa6db794f11dda52e4b015559439c54bc	scripts/backup/postgres-client-env.test.mjs
          100644 blob 2096f69334b2861b746b3e48bd0ba6f5263912b4	scripts/backup/postgres-client-wiring.test.mjs
          100644 blob 2dd2cdc1a867088ee810c4e77c272f8e6766ff91	scripts/backup/prepare-disposable-restore.mjs
          100644 blob 96b5dc8e449f8c2892bfa9708f7f32d20ba97067	scripts/backup/prune-b2.mjs
          100644 blob 030f565abddc847181af1689d26cae4217fd1916	scripts/backup/prune-b2.test.mjs
          100644 blob 31a1f687fa5aa100e240ce2afb857d4f65d139db	scripts/backup/restore-cleanup.test.mjs
          100644 blob 2379ade37255f0850bf87e6f95683121b95db217	scripts/backup/restore-logical.mjs
          100644 blob 946cdc79feb7ee93396c43be32b8e2152c88e974	scripts/backup/restore-target.test.mjs
          100644 blob 8f6e9ac2150173a1facbc33f6ecef83b6489e40f	scripts/backup/run-scheduled-mocked.test.mjs
          100644 blob 06c2a81b2c002b8ba97af1619826a7918b0d7952	scripts/backup/run-scheduled.mjs
          100644 blob 8b1515620cdfdd34c87c70a6f54f851e6dcbe076	scripts/backup/run-scheduled.test.mjs
          100644 blob 5c559d087c2cd5cf7ca153ef36d2ba8f18bfc4da	scripts/backup/selftest.mjs
          100644 blob 4729ee17a72a9a496e4314f834c6474d2466791d	scripts/backup/staging-rehearsal-wiring.test.mjs
          100644 blob 0c237f05e99127dcff02063ff71a2b33f120f21e	scripts/backup/upload-b2.mjs
          100644 blob 96d7bffb15b4ca1564dec2c4edfdc9535754d10a	scripts/backup/validate-staging-source.mjs
          100644 blob af91b682ad02f8162334dfd77c35cc427b94b2ba	scripts/backup/verify-b2-staging-scope.mjs
          100644 blob fdf129236120eb16fa50af4502e226a61821ca56	scripts/backup/verify-b2-staging-scope.test.mjs
          100644 blob c6134e56f402d2f9aca0b8dd70de5a8b41a52057	scripts/backup/verify-backup-file.mjs
          100644 blob 305ea6cbc2816c66efa3c786bdb2677cb90c292c	scripts/backup/verify-backup-file.test.mjs
          100644 blob d8b01c9ccc4bf9f69220e237a543e5b6127b506a	scripts/backup/verify-restored-db.mjs
          100644 blob 102a1839567f812adfd3f85acafefee0791f1a9b	scripts/backup/verify-restored-db.test.mjs
          V3_MANIFEST
          git ls-tree -r FETCH_HEAD -- scripts/backup .github/actions/postgres-client package.json package-lock.json > actual.txt
          if diff -q expected.txt actual.txt >/dev/null; then
            echo 'exact-code gate: the requested ref carries the pinned staging implementation (53 files, byte for byte)'
            exit 0
          fi
          echo '::error::exact-code gate REFUSED: the requested ref does not contain the pinned staging implementation — refusing before any credential is materialized (paths only below; contents are never printed)'
          echo '--- missing from the ref:'
          comm -23 <(cut -f2 expected.txt | LC_ALL=C sort) <(cut -f2 actual.txt | LC_ALL=C sort)
          echo '--- unexpected in the ref:'
          comm -13 <(cut -f2 expected.txt | LC_ALL=C sort) <(cut -f2 actual.txt | LC_ALL=C sort)
          echo '--- changed relative to the audit:'
          awk -F'\t' 'NR==FNR { e[$2]=$1; next } ($2 in e) && e[$2] != $1 { print "changed: " $2 }' expected.txt actual.txt
          exit 1
          # --- exact-code-gate END

  staging-rehearsal:
    name: staging backup → B2 → disposable restore
    needs: exact-code-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: backup-staging
    services:
      drilldb:
        image: postgres:17
        env:
          POSTGRES_DB: drill
          POSTGRES_PASSWORD: drill-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          # After the exact-code gate passes, this checks out EXACTLY the
          # verified commit — the rehearsal never runs anything the gate did
          # not pin. Empty input resolves to the commit the workflow runs at.
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install PostgreSQL 17 client
        uses: ./.github/actions/postgres-client
        with:
          version: "17"
      - name: Install dependencies
        run: npm ci
      - name: Prove disposable PostgreSQL 17 target before reading staging credentials
        env:
          DRILLDB_CONTAINER_ID: ${{ job.services.drilldb.id }}
          PGPASSWORD: drill-${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -n "$DRILLDB_CONTAINER_ID" ]
          identity="$(docker inspect --format '{{.Config.Image}}|{{.State.Running}}' "$DRILLDB_CONTAINER_ID")"
          [ "$identity" = 'postgres:17|true' ]
          result="$(psql -X -w -h 127.0.0.1 -p 5432 -U postgres -d drill -At -F '|' -v ON_ERROR_STOP=1 \
            -c "select current_database(), current_user, current_setting('server_version_num')::int / 10000, (select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r')")"
          [ "$result" = 'drill|postgres|17|0' ]
          echo 'Disposable restore target verified: ephemeral service container, PostgreSQL 17, loopback endpoint, empty drill database.'
      - name: Preflight — backup-staging presence check, names only (values never read)
        env:
          STAGING_SECRET_STAGING_AUTODINE_BACKUP_PASSPHRASE_SET: ${{ secrets.STAGING_AUTODINE_BACKUP_PASSPHRASE != '' }}
          STAGING_SECRET_STAGING_AUTODINE_BACKUP_SOURCE_URL_SET: ${{ secrets.STAGING_AUTODINE_BACKUP_SOURCE_URL != '' }}
          STAGING_SECRET_STAGING_B2_ACCESS_KEY_ID_SET: ${{ secrets.STAGING_B2_ACCESS_KEY_ID != '' }}
          STAGING_SECRET_STAGING_B2_REGION_SET: ${{ secrets.STAGING_B2_REGION != '' }}
          STAGING_SECRET_STAGING_B2_SECRET_ACCESS_KEY_SET: ${{ secrets.STAGING_B2_SECRET_ACCESS_KEY != '' }}
          STAGING_SECRET_STAGING_B2_BUCKET_SET: ${{ secrets.STAGING_B2_BUCKET != '' }}
          STAGING_VAR_AUTODINE_PRODUCTION_B2_BUCKETS_SET: ${{ vars.AUTODINE_PRODUCTION_B2_BUCKETS != '' }}
          STAGING_VAR_AUTODINE_STAGING_B2_BUCKET_SET: ${{ vars.AUTODINE_STAGING_B2_BUCKET != '' }}
          STAGING_VAR_AUTODINE_STAGING_PROJECT_REF_SET: ${{ vars.AUTODINE_STAGING_PROJECT_REF != '' }}
        run: |
          set -euo pipefail
          missing=''
          for pair in \
            "STAGING_AUTODINE_BACKUP_PASSPHRASE:${STAGING_SECRET_STAGING_AUTODINE_BACKUP_PASSPHRASE_SET}" \
            "STAGING_AUTODINE_BACKUP_SOURCE_URL:${STAGING_SECRET_STAGING_AUTODINE_BACKUP_SOURCE_URL_SET}" \
            "STAGING_B2_ACCESS_KEY_ID:${STAGING_SECRET_STAGING_B2_ACCESS_KEY_ID_SET}" \
            "STAGING_B2_REGION:${STAGING_SECRET_STAGING_B2_REGION_SET}" \
            "STAGING_B2_SECRET_ACCESS_KEY:${STAGING_SECRET_STAGING_B2_SECRET_ACCESS_KEY_SET}" \
            "STAGING_B2_BUCKET:${STAGING_SECRET_STAGING_B2_BUCKET_SET}" \
            "AUTODINE_PRODUCTION_B2_BUCKETS:${STAGING_VAR_AUTODINE_PRODUCTION_B2_BUCKETS_SET}" \
            "AUTODINE_STAGING_B2_BUCKET:${STAGING_VAR_AUTODINE_STAGING_B2_BUCKET_SET}" \
            "AUTODINE_STAGING_PROJECT_REF:${STAGING_VAR_AUTODINE_STAGING_PROJECT_REF_SET}" \
          ; do
            name="${pair%%:*}"
            flag="${pair##*:}"
            if [ "$flag" != 'true' ]; then missing="${missing} ${name}"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::backup-staging is missing required configuration:${missing} (values are never printed; nothing was attempted)"
            exit 1
          fi
          echo 'backup-staging preflight: all six required staging secrets and three required staging variables are set (values never read by this step).'
      - name: Refuse undesignated source and bucket before connecting
        env:
          AUTODINE_BACKUP_SOURCE_URL: ${{ secrets.STAGING_AUTODINE_BACKUP_SOURCE_URL }}
          B2_BUCKET: ${{ secrets.STAGING_B2_BUCKET }}
          AUTODINE_STAGING_PROJECT_REF: ${{ vars.AUTODINE_STAGING_PROJECT_REF }}
          AUTODINE_STAGING_B2_BUCKET: ${{ vars.AUTODINE_STAGING_B2_BUCKET }}
          AUTODINE_PRODUCTION_B2_BUCKETS: ${{ vars.AUTODINE_PRODUCTION_B2_BUCKETS }}
        run: node scripts/backup/validate-staging-source.mjs
      - name: Enforce the authoritative passphrase contract before any source connection
        env:
          AUTODINE_BACKUP_PASSPHRASE: ${{ secrets.STAGING_AUTODINE_BACKUP_PASSPHRASE }}
        run: |
          node --input-type=module <<'PASSPHRASE_CHECK'
          import { MIN_PASSPHRASE_LENGTH, passphraseProblem } from './scripts/backup/lib-crypto.mjs';
          const problem = passphraseProblem(process.env.AUTODINE_BACKUP_PASSPHRASE);
          if (problem) {
            console.error('Configured staging backup passphrase does not satisfy the authoritative contract.');
            process.exit(1);
          }
          console.log(`Staging backup passphrase contract accepted (minimum=${MIN_PASSPHRASE_LENGTH}; value and length not logged).`);
          PASSPHRASE_CHECK
      - name: Prove B2 key is restricted to the designated staging bucket
        env:
          B2_ACCESS_KEY_ID: ${{ secrets.STAGING_B2_ACCESS_KEY_ID }}
          B2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_B2_SECRET_ACCESS_KEY }}
          B2_BUCKET: ${{ secrets.STAGING_B2_BUCKET }}
          B2_EXPECTED_BUCKET_ID: d209a0cc2db8f17fac100514
          AUTODINE_STAGING_B2_BUCKET: ${{ vars.AUTODINE_STAGING_B2_BUCKET }}
        run: node scripts/backup/verify-b2-staging-scope.mjs
      - name: Authentication check and read-only source identity
        env:
          AUTODINE_BACKUP_SOURCE_URL: ${{ secrets.STAGING_AUTODINE_BACKUP_SOURCE_URL }}
          AUTODINE_STAGING_PROJECT_REF: ${{ vars.AUTODINE_STAGING_PROJECT_REF }}
        run: |
          node --input-type=module <<'AUTH_CHECK'
          import { spawnSync } from 'node:child_process';
          import { resolvePgClient } from './scripts/backup/lib-pg-client.mjs';
          import { withPgService } from './scripts/backup/lib-pg-service.mjs';
          try {
            const client = resolvePgClient('psql', { required: true });
            const result = withPgService(process.env.AUTODINE_BACKUP_SOURCE_URL, ({ env, dbname }) =>
              spawnSync(client.path, ['-X', '-w', '-q', '-A', '-t', '-F', '|', '-d', dbname, '-c',
                "select current_database(), current_user, current_setting('server_version_num')"],
              { env, encoding: 'utf8', timeout: 15000 }));
            if (result.error || result.status !== 0) throw new Error('authentication failed');
            const [database, user, version] = String(result.stdout || '').trim().split('|');
            if (!database || !user || !/^17\d+$/.test(version || '')) throw new Error('identity check failed');
            console.log(`Staging source authenticated: project=${process.env.AUTODINE_STAGING_PROJECT_REF} database=${database} user=${user} PostgreSQL=17.`);
          } catch {
            console.error('Staging source authentication or identity check failed; inspect approved configuration without exposing credentials.');
            process.exitCode = 1;
          }
          AUTH_CHECK
      - name: Back up staging, verify locally and upload to B2
        env:
          AUTODINE_BACKUP_SOURCE_URL: ${{ secrets.STAGING_AUTODINE_BACKUP_SOURCE_URL }}
          AUTODINE_BACKUP_PASSPHRASE: ${{ secrets.STAGING_AUTODINE_BACKUP_PASSPHRASE }}
          B2_REGION: ${{ secrets.STAGING_B2_REGION }}
          B2_BUCKET: ${{ secrets.STAGING_B2_BUCKET }}
          B2_ACCESS_KEY_ID: ${{ secrets.STAGING_B2_ACCESS_KEY_ID }}
          B2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_B2_SECRET_ACCESS_KEY }}
        run: |
          set -uo pipefail
          dir="$RUNNER_TEMP/autodine-staging-backup"
          mkdir -p "$dir"
          echo "PIPELINE_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          # Never relay child output, provider errors, paths or secret lengths.
          # A failed publication can leave uncertain remote state; no retry.
          if ! node scripts/backup/run-scheduled.mjs --out-dir "$dir" --rpo-minutes 1440 --b2 --report "$dir/pipeline-report.json" > /dev/null 2>&1; then
            echo '::error::Staging backup failed; remote state is unknown. Investigate without retry or deletion.'
            exit 1
          fi
      - name: Download newest B2 artifact and verify integrity
        env:
          B2_REGION: ${{ secrets.STAGING_B2_REGION }}
          B2_BUCKET: ${{ secrets.STAGING_B2_BUCKET }}
          B2_ACCESS_KEY_ID: ${{ secrets.STAGING_B2_ACCESS_KEY_ID }}
          B2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_B2_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/autodine-staging-download"
          start="$(date +%s)"
          node scripts/backup/download-b2.mjs --out-dir "$RUNNER_TEMP/autodine-staging-download" | tee "$RUNNER_TEMP/autodine-staging-download/download-report.json"
          echo "DOWNLOAD_SECONDS=$(($(date +%s) - start))" >> "$GITHUB_ENV"
      - name: Restore and verify in disposable PostgreSQL
        env:
          AUTODINE_BACKUP_PASSPHRASE: ${{ secrets.STAGING_AUTODINE_BACKUP_PASSPHRASE }}
          AUTODINE_RESTORE_TARGET_URL: postgresql://postgres:drill-${{ github.run_id }}@127.0.0.1:5432/drill
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/autodine-staging-download"
          mapfile -t artifacts < <(find "$dir" -maxdepth 1 -type f -name '*.enc')
          if [ "${#artifacts[@]}" -ne 1 ]; then echo '::error::Expected exactly one downloaded artifact'; exit 1; fi
          artifact="${artifacts[0]}"
          manifest="$(printf '%s' "$artifact" | sed -E 's/\.(sql\.gz|dump)\.enc$/.manifest.json/')"
          mapfile -t source_manifests < <(find "$RUNNER_TEMP/autodine-staging-backup" -maxdepth 1 -type f -name '*.manifest.json')
          if [ "${#source_manifests[@]}" -ne 1 ]; then echo '::error::Expected exactly one newly produced manifest'; exit 1; fi
          node scripts/backup/compare-rehearsal-manifests.mjs "${source_manifests[0]}" "$manifest"
          node scripts/backup/verify-backup-file.mjs "$artifact" --manifest "$manifest"
          node scripts/backup/prepare-disposable-restore.mjs --confirm-disposable
          start="$(date +%s)"
          node scripts/backup/restore-logical.mjs --file "$artifact" --confirm-empty-db
          echo "RESTORE_SECONDS=$(($(date +%s) - start))" >> "$GITHUB_ENV"
          node scripts/backup/verify-restored-db.mjs --manifest "$manifest" --artifact "$artifact" | tee "$dir/restore-report.json"
      - name: Compute sanitized recovery metrics
        env:
          CODE_SHA: ${{ inputs.ref || github.sha }}
        run: |
          node --input-type=module <<'METRICS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const backupDir = process.env.RUNNER_TEMP + '/autodine-staging-backup';
          const downloadDir = process.env.RUNNER_TEMP + '/autodine-staging-download';
          const manifestName = (await import('node:fs')).readdirSync(backupDir).find((name) => name.endsWith('.manifest.json'));
          const manifest = JSON.parse(readFileSync(path.join(backupDir, manifestName), 'utf8'));
          const pipeline = JSON.parse(readFileSync(path.join(backupDir, 'pipeline-report.json'), 'utf8'));
          const download = JSON.parse(readFileSync(path.join(downloadDir, 'download-report.json'), 'utf8'));
          const restore = JSON.parse(readFileSync(path.join(downloadDir, 'restore-report.json'), 'utf8'));
          const completedEpoch = Math.floor(Date.now() / 1000);
          const summary = {
            result: 'PASS',
            codeSha: process.env.CODE_SHA,
            sourceProject: 'juwyhslzchjevqkdvwjm',
            destination: { bucket: 'autodine-staging-db-backups', bucketId: 'd209a0cc2db8f17fac100514', region: 'eu-central-003' },
            integrity: { sha256: manifest.sha256, bytes: manifest.bytes, downloadedSha256: download.sha256 },
            timingsSeconds: {
              backup: pipeline.timings.backupSeconds,
              upload: pipeline.timings.uploadSeconds,
              download: Number(process.env.DOWNLOAD_SECONDS),
              restore: Number(process.env.RESTORE_SECONDS),
              endToEndRto: completedEpoch - Number(process.env.PIPELINE_STARTED_EPOCH),
            },
            measuredRpoSeconds: Math.max(0, completedEpoch - Math.floor(new Date(manifest.createdAt).getTime() / 1000)),
            restored: { verified: restore.verified, matches: restore.matches },
          };
          if (!summary.restored.verified || summary.integrity.sha256 !== summary.integrity.downloadedSha256) process.exit(1);
          writeFileSync(path.join(downloadDir, 'rehearsal-summary.json'), JSON.stringify(summary, null, 2) + '\n', { mode: 0o600 });
          METRICS
      - name: Sanitized failure diagnostic
        if: failure()
        run: |
          echo '::error::Rehearsal failed or was blocked; inspect authorized evidence without exposing credentials.'
      - name: Evidence summary
        if: always()
        run: |
          JOB_RESULT='${{ job.status }}' CODE_SHA='${{ inputs.ref || github.sha }}' \
            node --input-type=module <<'SUMMARY' >> "$GITHUB_STEP_SUMMARY"
          import { existsSync, readFileSync } from 'node:fs';
          const report = `${process.env.RUNNER_TEMP}/autodine-staging-download/rehearsal-summary.json`;
          console.log('## Staging B2 rehearsal');
          console.log(`- Result: ${process.env.JOB_RESULT}`);
          console.log(`- Exact-code-gated implementation: ${process.env.CODE_SHA}`);
          if (existsSync(report)) {
            const r = JSON.parse(readFileSync(report, 'utf8'));
            console.log(`- Backup / upload / download / restore: ${r.timingsSeconds.backup}s / ${r.timingsSeconds.upload}s / ${r.timingsSeconds.download}s / ${r.timingsSeconds.restore}s`);
            console.log(`- Measured end-to-end RTO: ${r.timingsSeconds.endToEndRto}s; measured RPO at verification: ${r.measuredRpoSeconds}s.`);
            console.log(`- SHA-256 integrity: ${r.integrity.sha256}; restored comparisons: PASS.`);
          }
          console.log('- Disposable PostgreSQL scaffold only; Supabase Auth/Storage and production were not restored or contacted.');
          SUMMARY
      - name: Preserve reports only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-b2-rehearsal-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/autodine-staging-backup/*.manifest.json
            ${{ runner.temp }}/autodine-staging-backup/pipeline-report.json
            ${{ runner.temp }}/autodine-staging-download/download-report.json
            ${{ runner.temp }}/autodine-staging-download/restore-report.json
            ${{ runner.temp }}/autodine-staging-download/rehearsal-summary.json
          if-no-files-found: ignore
          retention-days: 35
      - name: Remove backup material
        if: always()
        run: rm -rf "$RUNNER_TEMP/autodine-staging-backup" "$RUNNER_TEMP/autodine-staging-download"
