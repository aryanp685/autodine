# Supabase local configuration.
#
# Scaffold only — there are no migrations yet. M1 creates the first one.
# Until then, `supabase start` (needs Docker) will bring up a local stack for
# development at zero cost and without consuming one of the two free cloud
# project slots.
#
# The CLI is intentionally NOT a project dependency: it downloads a platform
# binary at install time, which would make Netlify builds depend on a GitHub
# download. Use it via npx, or install it globally:
#     npx supabase --version
#     npm install -g supabase

project_id = "autodine"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "1MB"
