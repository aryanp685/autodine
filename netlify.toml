# AutoDine — Netlify configuration
#
# Netlify detects Next.js automatically and provisions the OpenNext adapter
# (SSR, ISR, route handlers, image optimisation, edge middleware). Two rules
# from Netlify's docs are deliberately honoured here:
#   - do NOT set `publish` (the adapter owns the output layout)
#   - do NOT pin the adapter version (Netlify updates it per build)
[build]
  command = "npm run build"

# Basic hardening. Declarative only; does not affect rendering.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
